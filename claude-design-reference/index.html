<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F6F3EC" />
  <title>Coffee Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="timer-card">
    <div class="app-header">
      <h1>Coffee Timer</h1>
      <button
        id="sound-settings-button"
        class="control-button sound"
        type="button"
        aria-label="音設定を開く"
        aria-expanded="false"
        aria-controls="sound-settings"
      ><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></button>
    </div>

    <div class="layout-timer">
    <p class="current-step" id="current-step" aria-live="polite">現在：蒸らし</p>

    <section class="timer-display" aria-label="残り時間">
      <time id="time-display" datetime="PT1M">01:00</time>
    </section>

    <p class="status" id="status-text" aria-live="polite">準備完了</p>

    <section class="progress-area" aria-label="抽出の進捗">
      <div id="progress-chips" class="progress-chips"></div>
      <div class="progress-track" aria-hidden="true"><div id="progress-bar-fill" class="progress-bar-fill"></div></div>
      <p id="next-step-text" class="next-step" aria-live="polite"></p>
    </section>

    <div class="controls" aria-label="タイマー操作">
      <button id="start-button" class="control-button start" type="button" aria-label="開始"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></button>
      <button id="pause-button" class="control-button" type="button" aria-label="一時停止"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg></button>
      <button id="reset-button" class="control-button" type="button" aria-label="リセット"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg></button>
    </div>
    </div>

    <div class="layout-side">
    <div class="step-selector">
      <div class="preset-field">
        <label class="visually-hidden" for="timer-preset">抽出メニュー</label>
        <select id="timer-preset"></select>
      </div>
      <button id="edit-button" class="edit-button" type="button" aria-expanded="false" aria-controls="step-editor">
        編集
      </button>
    </div>

    <div class="bean-memo-actions">
      <button
        id="bean-memo-button"
        class="memo-button"
        type="button"
        aria-expanded="false"
        aria-controls="bean-memo-panel"
      >
        ☕ 豆メモ
      </button>
    </div>

    <section id="sound-settings" class="sound-settings" aria-labelledby="sound-settings-title" hidden>
      <div class="sound-settings-heading">
        <h2 id="sound-settings-title">音設定</h2>
        <button id="sound-settings-close" class="sound-close-button" type="button" aria-label="音設定を閉じる">×</button>
      </div>

      <div class="sound-group">
        <h3>通知音</h3>

        <div class="sound-setting-row">
          <span>通知音</span>
          <label class="toggle-switch">
            <input id="alert-enabled" type="checkbox" aria-label="通知音のON/OFF" />
            <span class="toggle-track" aria-hidden="true"></span>
            <span id="alert-toggle-label" class="toggle-label">ON</span>
          </label>
        </div>

        <label class="sound-setting-row" for="alert-sound">
          <span>種類</span>
          <select id="alert-sound">
            <option value="bell">Bell</option>
            <option value="wood">Wood</option>
            <option value="soft">Soft</option>
          </select>
        </label>

        <label class="sound-setting-row volume-row" for="alert-volume">
          <span>音量</span>
          <span class="volume-control">
            <input id="alert-volume" type="range" min="0" max="100" step="1" />
            <output id="alert-volume-value" for="alert-volume">91</output>
          </span>
        </label>
      </div>

      <div class="sound-group">
        <h3>曲</h3>

        <div class="sound-setting-row">
          <span>BGM</span>
          <label class="toggle-switch">
            <input id="bgm-enabled" type="checkbox" aria-label="BGMのON/OFF" />
            <span class="toggle-track" aria-hidden="true"></span>
            <span id="bgm-toggle-label" class="toggle-label">OFF</span>
          </label>
        </div>

        <label class="sound-setting-row" for="bgm-track">
          <span>曲選択</span>
          <select id="bgm-track">
            <option value="none">None</option>
            <option value="morning-coffee">Morning Coffee</option>
            <option value="cafe-jazz">Cafe Jazz</option>
            <option value="rain">Rain</option>
            <option value="lofi">Lo-Fi</option>
          </select>
        </label>

        <label class="sound-setting-row volume-row" for="bgm-volume">
          <span>音量</span>
          <span class="volume-control">
            <input id="bgm-volume" type="range" min="0" max="100" step="1" />
            <output id="bgm-volume-value" for="bgm-volume">59</output>
          </span>
        </label>
      </div>

      <p id="bgm-status" class="bgm-status" aria-live="polite"></p>
      <button id="sound-settings-close-bottom" class="sound-close-text-button" type="button">閉じる</button>
    </section>

    <section id="step-editor" class="step-editor" aria-labelledby="editor-title" hidden>
      <div class="editor-heading">
        <h2 id="editor-title">メニュー編集</h2>
        <button id="new-menu-button" class="text-button" type="button">新規メニュー</button>
      </div>

      <label class="menu-name-field">
        <span>メニュー名</span>
        <input id="menu-name" type="text" maxlength="30" required />
      </label>

      <div id="step-list" class="step-list"></div>

      <button id="add-step-button" class="add-step-button" type="button" aria-label="工程を追加">＋</button>
      <button id="save-menu-button" class="save-button" type="button">保存</button>
      <p id="editor-message" class="editor-message" aria-live="polite"></p>
    </section>

    <section id="bean-memo-panel" class="bean-memo-panel" aria-labelledby="bean-memo-title" hidden>
      <div class="bean-memo-heading">
        <div>
          <h2 id="bean-memo-title">Coffee Bean Memo</h2>
          <p id="bean-form-mode" class="bean-form-mode">新しい豆メモ</p>
        </div>
        <button id="bean-form-clear" class="text-button" type="button">新規</button>
      </div>

      <form id="bean-form" class="bean-form">
        <input id="bean-id" type="hidden" />

        <div class="bean-form-section">
          <h3>基本情報</h3>
          <label class="bean-field">
            <span>豆の名前</span>
            <input id="bean-name" type="text" maxlength="80" required autocomplete="off" />
          </label>
          <label class="bean-field">
            <span>ロースター / 購入店</span>
            <input id="bean-roaster" list="roaster-list" type="text" maxlength="80" autocomplete="off" />
            <datalist id="roaster-list"></datalist>
          </label>
          <div class="bean-field-grid">
            <label class="bean-field">
              <span>地域</span>
              <select id="bean-origin-region"></select>
            </label>
            <label class="bean-field">
              <span>国</span>
              <select id="bean-origin-country"></select>
            </label>
          </div>
          <label id="bean-origin-country-other-field" class="bean-field" hidden>
            <span>追加する国</span>
            <input id="bean-origin-country-other" type="text" maxlength="80" autocomplete="off" />
          </label>
          <label class="bean-field">
            <span>精製方法</span>
            <select id="bean-process"></select>
          </label>
          <label id="bean-process-other-field" class="bean-field" hidden>
            <span>その他の精製方法</span>
            <input id="bean-process-other" type="text" maxlength="60" autocomplete="off" />
          </label>
          <label class="bean-field">
            <span>焙煎度</span>
            <select id="bean-roast-level"></select>
          </label>
          <label id="bean-roast-level-other-field" class="bean-field" hidden>
            <span>その他の焙煎度</span>
            <input id="bean-roast-level-other" type="text" maxlength="60" autocomplete="off" />
          </label>
        </div>

        <details id="bean-detail-section" class="bean-collapsible">
          <summary>詳細情報</summary>
          <div class="bean-collapsible-body bean-field-grid">
            <label class="bean-field">
              <span>購入日</span>
              <input id="bean-purchase-date" type="date" />
            </label>
            <label class="bean-field">
              <span>開封日</span>
              <input id="bean-opened-date" type="date" />
            </label>
            <label class="bean-field">
              <span>購入価格</span>
              <input id="bean-price" type="number" min="0" step="1" inputmode="numeric" />
            </label>
            <label class="bean-field">
              <span>内容量g</span>
              <input id="bean-weight-gram" type="number" min="0" step="1" inputmode="numeric" />
            </label>
          </div>
        </details>

        <section class="bean-form-section bean-rating-section" aria-labelledby="bean-rating-title">
          <div class="bean-section-title-row">
            <h3 id="bean-rating-title">味の評価</h3>
            <div class="overall-score">
              <span>総合評価</span>
              <output id="bean-rating-overall-output" for="bean-rating-overall">3</output>
            </div>
          </div>

          <svg id="bean-radar-chart" class="bean-radar-chart" viewBox="0 0 180 180" role="img" aria-label="味の評価レーダーチャート"></svg>

          <div class="flavor-preview">
            <span>フレーバーノート</span>
            <div id="bean-flavor-tags" class="flavor-tags" aria-live="polite"></div>
          </div>

          <details id="bean-rating-editor" class="bean-collapsible compact">
            <summary>評価を編集</summary>
            <div class="bean-collapsible-body">
              <div id="bean-rating-controls" class="rating-button-list"></div>
              <input id="bean-rating-acidity" type="hidden" value="3" />
              <input id="bean-rating-bitterness" type="hidden" value="3" />
              <input id="bean-rating-sweetness" type="hidden" value="3" />
              <input id="bean-rating-body" type="hidden" value="3" />
              <input id="bean-rating-aroma" type="hidden" value="3" />
              <input id="bean-rating-aftertaste" type="hidden" value="3" />
              <input id="bean-rating-drinkability" type="hidden" value="3" />
              <input id="bean-rating-overall" type="hidden" value="3" />

              <label class="bean-field flavor-input-field">
                <span>フレーバーノート</span>
                <input id="bean-flavor-notes" type="text" placeholder="柑橘, 花, 紅茶" autocomplete="off" />
              </label>
            </div>
          </details>
        </section>

        <details id="bean-note-section" class="bean-collapsible">
          <summary>メモ</summary>
          <div class="bean-collapsible-body">
            <label class="bean-field">
              <span>感想メモ</span>
              <textarea id="bean-memo" rows="3"></textarea>
            </label>
            <label class="bean-field">
              <span>次回試したいこと</span>
              <textarea id="bean-next-try" rows="3"></textarea>
            </label>
            <label class="bean-field">
              <span>リピート評価</span>
              <select id="bean-repeat-rating"></select>
            </label>
            <label class="bean-check-field">
              <input id="bean-is-favorite" type="checkbox" />
              <span>お気に入り</span>
            </label>
          </div>
        </details>

        <button id="bean-save-button" class="save-button" type="submit">保存</button>
        <p id="bean-message" class="editor-message" aria-live="polite"></p>
      </form>

      <div class="bean-list-area">
        <h3>豆メモ一覧</h3>
        <div id="bean-list" class="bean-list"></div>
      </div>
    </section>
    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="main.js"></script>
  <script src="js/beans.js"></script>
  <script src="js/progress.js"></script>
</body>
</html>
